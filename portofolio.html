<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maria Kafkala - Project Portfolio</title>
    <style>
        /* Βασικές Ρυθμίσεις */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fbf9fc;
        }
        
        /* Header & Μενού */
        header {
            text-align: center;
            padding: 30px 20px;
            background-color: #fbf9fc;
        }
        .logo {
            font-size: 36px;
            color: #8c6a9f;
            font-weight: 400;
            margin-bottom: 20px;
        }
        nav a {
            text-decoration: none;
            color: #777;
            margin: 0 15px;
            font-size: 15px;
        }
        nav a.active {
            background-color: #8c6a9f;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
        }

        /* Banner Εισαγωγής με το κενό κουτί δεξιά */
        .portfolio-banner {
            background-color: #eedff1; /* Ανοιχτό ροζ-μωβ ακριβώς όπως στην εικόνα */
            padding: 60px 20px;
        }
        .banner-container {
            display: flex;
            max-width: 1100px;
            margin: 0 auto;
            align-items: center;
            gap: 50px;
        }
        .banner-text {
            flex: 1.5;
            text-align: left;
        }
        .banner-text h1 {
            color: #8c6a9f;
            font-size: 34px;
            font-weight: 400;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .banner-text p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }
        /* Το μικρό διακεκομμένο κουτί */
        .empty-box-small {
            flex: 1;
            border: 1px dashed #d1b3d8;
            height: 70px;
            border-radius: 4px;
            background-color: transparent;
        }

        /* Ενότητα Αρχείου Εργασιών (Λευκή σελίδα) */
        .archive-section {
            padding: 60px 20px 80px;
            text-align: center;
            background-color: #fbf9fc;
        }
        .archive-section h2 {
            color: #8c6a9f;
            font-size: 30px;
            font-weight: 400;
            margin-bottom: 40px;
        }
        /* Το μεγάλο, οριζόντιο διακεκομμένο κουτί */
        .empty-box-large {
            max-width: 1100px;
            margin: 0 auto;
            border: 1px dashed #d1b3d8;
            height: 50px;
            border-radius: 4px;
            background-color: transparent;
        }

        /* Footer (Όπως στην 5η εικόνα) */
        footer {
            background-color: #4a2b66;
            color: rgba(255, 255, 255, 0.7);
            padding: 40px 60px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .footer-left {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        /* Το κυκλικό εικονίδιο του LinkedIn */
        .linkedin-icon {
            width: 36px;
            height: 36px;
            background-color: #9c7bb0;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            font-family: Arial, sans-serif;
            transition: 0.3s;
        }
        .linkedin-icon:hover {
            background-color: #8c6a9f;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MK Maria Kafkala</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="resume.html">Resume & Experience</a>
            <a href="portfolio.html" class="active">Project Portfolio</a>
        </nav>
    </header>

    <section class="portfolio-banner">
        <div class="banner-container">
            <div class="banner-text">
                <h1>Project portfolio & course assignments</h1>
                <p>Welcome to my academic and project management portfolio. This dedicated space serves as an archive for my projects from the M110 course!!</p>
        </div>
    </section>

    <section class="archive-section">
        <h2>Recent coursework & project archive</h2>
        <!-- Το μακρόστενο διακεκομμένο πλαίσιο από κάτω -->
        <div class="empty-box-large"></div>
    </section>

    <footer>
        <div class="footer-left">
            <span>© 2026 Maria Kafkala</span>
        </div>
    </footer>

</body>
</html>
